name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/spear/ears.mjs docs/requirements.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r resourcepack/halloween/requirements.txt
      - run: python -m unittest discover -s tools/resourcepack -p 'test_*.py' -v
      - run: bash ./mvnw -B -ntp clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: EnthusiaSignature
          path: target/EnthusiaSignature-1.3.0.jar
