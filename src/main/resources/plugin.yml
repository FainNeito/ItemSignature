name: EnthusiaSignature
version: '${project.version}'
main: net.enthusia.itemsignature.infrastructure.ItemSignaturePlugin
api-version: '1.21.11'
description: Permanent signatures and live item statistics.
authors: [Enthusia]
softdepend: [DiaryKeeper, EnthusiaLoreItems, Nexo]
commands:
  sign:
    description: Permanently sign your held item.
    usage: '/sign [--color <red or #RRGGBB>] [message] | confirm | cancel'
  track:
    description: Attach a stat tracker or remove your own tracker when enabled.
    usage: /track <stat|remove>
  itemsignature:
    description: Legacy command to show help or reload configuration.
    usage: /itemsignature [reload]
  enthusiasignature:
    description: Show help or reload configuration.
    aliases: [enthusiasign, esign]
    usage: /enthusiasignature [reload]
permissions:
  itemsignature.sign:
    default: true
  itemsignature.color:
    default: false
  itemsignature.hex:
    default: false
    children:
      itemsignature.color: true
  itemsignature.quote:
    default: false
  itemsignature.glyph:
    default: false
  itemsignature.track.player_kills:
    default: false
  itemsignature.track.mob_kills:
    default: false
  itemsignature.track.blocks_broken:
    default: false
  itemsignature.reload:
    default: op
  itemsignature.track.remove:
    default: true
  itemsignature.track.distance_flown:
    default: false
  itemsignature.track.distance_walked:
    default: false
  itemsignature.track.shields_disabled:
    default: false
  itemsignature.track.times_fished:
    default: false
  itemsignature.track.portals_ignited:
    default: false
  itemsignature.track.times_lunged:
    default: false
  itemsignature.track.arrows_shot:
    default: false
  itemsignature.track.times_riptided:
    default: false
  itemsignature.track.times_thrown:
    default: false
  itemsignature.track.land_tilled:
    default: false
  itemsignature.track.sheep_sheared:
    default: false
  itemsignature.track.times_sifted:
    default: false
